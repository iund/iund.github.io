name: Pages

on:
  schedule:
    - cron: '17 */12 * * *'
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash _scripts/fetch-data.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # jekyll-build-pages writes _site as root; top-level names are safe to mangle as nothing refers to them from markup.
      - name: Minify
        run: |
          sudo chown -R "$(id -u)" _site
          npm install --no-save html-minifier-terser@7.2.0
          for f in _site/*.html; do
            npx html-minifier-terser --collapse-whitespace --conservative-collapse --remove-comments --minify-css true \
              --minify-js '{"compress":{"toplevel":true},"mangle":{"toplevel":true}}' -o "$f.min" "$f" && mv "$f.min" "$f"
          done
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Test
        run: |
          python3 -m http.server 8000 -d _site &
          until curl -s -o /dev/null http://localhost:8000; do sleep 1; done
          node --test --test-reporter=spec tests/*.test.mjs
      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
